<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RASU | Premium Futuristic Fashion</title>
    <meta name="description" content="RASU - Discover cutting-edge fashion with a futuristic edge. Premium streetwear, activewear, and accessories for the modern trendsetter." />
    <meta name="author" content="RASU" />
    <meta name="keywords" content="RASU, fashion, futuristic, streetwear, premium, e-commerce, clothing, activewear, accessories" />

    <meta property="og:title" content="RASU | Premium Futuristic Fashion" />
    <meta property="og:description" content="Discover cutting-edge fashion with a futuristic edge. Premium streetwear and accessories." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@RASU" />

    <link rel="icon" type="image/svg+xml" href="/placeholder.svg" />

    <!-- Preconnect for external origins -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

    <!-- Prevent FOUC: set theme class before React renders -->
    <script>
      (function() {
        var stored = localStorage.getItem('rasu-theme');
        var theme = stored || 'dark';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme);
        document.documentElement.style.setProperty('--banner-height', '0px');
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
